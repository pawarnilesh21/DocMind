target-version = "py311"
line-length = 110
exclude = ["venv", ".venv-prod", "frontend", "alembic"]
[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
[lint.per-file-ignores]
"tests/conftest.py" = ["E402"] # Test-only environment must be set before importing application modules.
