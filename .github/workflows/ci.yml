name: Verify DocMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docmind_test
          POSTGRES_USER: docmind_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind_test -d docmind_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://docmind_test:local-test-only@127.0.0.1:55432/docmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip check
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest --cov=app --cov-report=term-missing
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: docker build -t docmind-api:ci .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint -- --deny-warnings
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: docker build -t docmind-web:ci .
